<!DOCTYPE html>
<html lang="id">
<head>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Metamorfosis Kupu-kupu - TBO (MindAR)</title>

  <!-- 1. Panggil library A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- 2. Panggil library MindAR untuk A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    .ui-layer { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 10; }
    button { border: none; padding: 12px 20px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    button:active { transform: scale(0.95); }
    button:disabled { background-color: #ddd; color: #999; cursor: not-allowed; }
    #btn-prev { background-color: #ff9800; color: white; }
    #btn-next { background-color: #4caf50; color: white; }
    #btn-info { background-color: #2196f3; color: white; }

    #info-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; box-sizing: border-box; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 20; }
    #info-overlay.active { opacity: 1; pointer-events: auto; }
    #info-overlay h2 { color: #4caf50; margin-bottom: 10px; }
    #info-overlay p { line-height: 1.6; font-size: 16px; max-width: 600px; }
    #btn-close-info { margin-top: 20px; background-color: #f44336; color: white; }

    .scan-hint { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: white; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 5; pointer-events: none; }
  </style>
</head>
<body>

  <!-- Panduan awal -->
  <div class="scan-hint" id="hint">Arahkan kamera ke kartu...</div>

  <!-- Scene A-Frame + MindAR -->
  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <!-- Preload semua model 3D agar transisi cepat -->
    <a-assets></a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target entity: model 3D akan menempel di sini -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
      <!-- Model awal: Telur -->
      <a-gltf-model id="model-3d" src="./Telur.glb" rotation="0 0 0" position="0 -0.2 0" scale="1 1 1"></a-gltf-model>
    </a-entity>

  </a-scene>

  <!-- UI Tombol -->
  <div class="ui-layer">
    <button id="btn-prev" disabled>◀ Back</button>
    <button id="btn-info">ℹ️ Penjelasan</button>
    <button id="btn-next">Next ▶</button>
  </div>

  <!-- Overlay Penjelasan -->
  <div id="info-overlay">
    <h2 id="info-title">Fase Telur</h2>
    <p id="info-text">Penjelasan akan muncul di sini...</p>
    <button id="btn-close-info">Tutup</button>
  </div>

  <script>
    // --- 1. Definisi State Machine (Otomata) ---
    const states = [
  { modelId: './Telur.glb', title: 'Fase: Telur', desc: '...' },
  { modelId: './Ulat.glb', title: 'Fase: Ulat (Larva)', desc: '...' },
  { modelId: './Kepompong.glb', title: 'Fase: Kepompong (Pupa)', desc: '...' },
  { modelId: './Kupukupu.glb', title: 'Fase: Kupu-kupu (Imago)', desc: '...' }
];
    let currentIndex = 0;

    // --- 2. Ambil Elemen ---
    const model3D = document.getElementById('model-3d');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnInfo = document.getElementById('btn-info');
    const infoOverlay = document.getElementById('info-overlay');
    const infoTitle = document.getElementById('info-title');
    const infoText = document.getElementById('info-text');
    const btnCloseInfo = document.getElementById('btn-close-info');
    const hint = document.getElementById('hint');

    // --- 3. Fungsi Update Tampilan (Transisi State) ---
    function updateUI() {
      const state = states[currentIndex];
      // Ganti model 3D dengan mengubah atribut src
      model3D.setAttribute('src', state.modelId);
      // Update teks penjelasan
      infoTitle.innerText = state.title;
      infoText.innerText = state.desc;
      // Atur status tombol
      btnPrev.disabled = currentIndex === 0;
      btnNext.disabled = currentIndex === states.length - 1;
    }

    // --- 4. Event Listener Tombol ---
    btnNext.addEventListener('click', () => {
      if (currentIndex < states.length - 1) { currentIndex++; updateUI(); }
    });
    btnPrev.addEventListener('click', () => {
      if (currentIndex > 0) { currentIndex--; updateUI(); }
    });
    btnInfo.addEventListener('click', () => { infoOverlay.classList.add('active'); });
    btnCloseInfo.addEventListener('click', () => { infoOverlay.classList.remove('active'); });

    // --- 5. Event Listener MindAR (Opsional tapi penting) ---
    const sceneEl = document.querySelector('a-scene');
    sceneEl.addEventListener('targetFound', () => {
      hint.style.display = 'none'; // Sembunyikan panduan scan
      console.log('Kartu terdeteksi!');
    });
    sceneEl.addEventListener('targetLost', () => {
      hint.style.display = 'block'; // Munculkan lagi panduan scan
      console.log('Kartu hilang dari pandangan');
    });

    // Inisialisasi awal
    updateUI();
  </script>
</body>
</html>
