<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Metamorfosis Kupu-kupu - TBO</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Panggil Library -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <!-- Panduan awal -->
  <div class="scan-hint" id="hint">Arahkan kamera ke kartu...</div>

  <!-- Scene A-Frame + MindAR -->
  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-assets></a-assets> <!-- Kosong karena kita load modelnya satu per satu -->

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target entity -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
      <!-- Model 3D Awal -->
      <a-gltf-model id="model-3d" src="./Telur.glb" rotation="0 0 0" position="0 -0.2 0" scale="1 1 1" animation-mixer></a-gltf-model>
    </a-entity>
  </a-scene>

  <!-- UI Tombol -->
  <div class="ui-layer">
    <button id="btn-prev" disabled>◀ Back</button>
    <button id="btn-info">ℹ️ Penjelasan</button>
    <button id="btn-next">Next ▶</button>
  </div>

  <!-- Overlay Penjelasan -->
  <div id="info-overlay">
    <div class="info-content">
      <h2 id="info-title">Fase Telur</h2>
      <p id="info-text">Penjelasan akan muncul di sini...</p>
      <button id="btn-close-info">Tutup</button>
    </div>
  </div>

  <!-- Panggil JS (taruh paling bawah biar HTML udah diload semua) -->
  <script src="script.js"></script>
</body>
</html>
